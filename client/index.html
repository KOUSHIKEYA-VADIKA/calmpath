<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>CalmPath — Gentle emotional check-ins</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <script>
    if (!localStorage.getItem('calmpathUser')) {
      window.location.href = 'login.html';
    }
  </script>

  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <div class="logo">🌿</div>
        <div>
          <h1 class="title">CalmPath</h1>
          <p class="tagline">Notice, reflect, restore</p>
        </div>
      </div>
      <div class="meta">
        <small class="meta-note">Private & Secure</small>
        <button id="logoutBtn" class="btn-ghost" style="padding:6px 12px; font-size:0.8rem;">
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="container">

    <section class="panel" aria-labelledby="day-heading">
      <h2 id="day-heading" class="panel-title">
        How was your day?
        <span id="dayContextResult" class="muted small-italic" style="font-weight:400; font-size:0.9rem;"></span>
      </h2>
      <div class="form-grid">
        <div>
          <select id="dayTypeSelect" class="input select">
            <option value="">Select context...</option>
            <option value="low-energy">Low-energy day</option>
            <option value="recovery">Recovery day</option>
            <option value="high-focus">High-focus day</option>
          </select>
        </div>
        <div id="dayContextFollowup"></div>
      </div>
    </section>

    <div class="split-top">
      
      <section class="panel" aria-labelledby="checkin-heading">
        <h2 id="checkin-heading" class="panel-title">Daily Check-In</h2>
        
        <div class="form-grid">
          <div class="col-form">
            <h3 class="small-title">Mind</h3>
            <label for="mood">Mood</label>
            <select id="mood" class="input select">
              <option value="anxious">Anxious</option>
              <option value="low">Low</option>
              <option value="stressed">Stressed</option>
              <option value="angry">Angry</option>
              <option value="neutral">Neutral</option>
            </select>

            <label for="intensity">Intensity (1-10)</label>
            <input id="intensity" type="number" min="1" max="10" value="5" class="input">

            <label for="triggers">Triggers</label>
            <input id="triggers" type="text" placeholder="exams, work..." class="input">
          </div>

          <div class="col-form">
            <h3 class="small-title">Body</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
              <div>
                <label for="sleepHours">Sleep (hrs)</label>
                <input id="sleepHours" type="number" step="0.5" class="input">
              </div>
              <div>
                <label for="sleepQuality">Quality</label>
                <input id="sleepQuality" type="number" min="1" max="5" class="input">
              </div>
            </div>

            <label for="screenTime">Screen Time</label>
            <input id="screenTime" type="number" step="0.5" class="input">

            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
               <div><label>Energy</label><input id="energyLevel" type="number" min="1" max="5" class="input"></div>
               <div><label>Focus</label><input id="focusLevel" type="number" min="1" max="5" class="input"></div>
               <div><label>Stress</label><input id="stressLevel" type="number" min="1" max="5" class="input"></div>
            </div>
            <input id="activityMinutes" type="number" class="input" style="display:none">
          </div>
        </div>

        <label for="note">Journal Note</label>
        <textarea id="note" rows="3" class="input textarea" placeholder="Thoughts..."></textarea>

        <div class="actions">
          <button id="submitMood" class="btn-primary" style="width:100%">Save Check-In</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="tasks-heading">
        <h2 id="tasks-heading" class="panel-title">Gentle Tasks</h2>
        
        <label>Add New Task</label>
        <input id="taskTitle" class="input" placeholder="e.g. 10 min walk">
        
        <div class="task-inputs-row">
           <input id="taskDate" type="date" class="input" style="flex:1">
           <input id="taskTime" type="time" class="input" style="flex:1">
        </div>
        
        <div class="actions">
           <button id="addTaskBtn" class="btn-primary" style="width:100%">Add Task</button>
        </div>

        <div id="taskList" style="margin-top:16px;"></div>
        
        <div style="margin-top:auto; padding-top:16px; border-top:1px solid #f1f5f9; display:flex; justify-content:space-between;">
           <div id="streakBox" class="small-italic"></div>
           <div id="badgeBox" class="small-italic"></div>
        </div>
      </section>

    </div>

    <section class="panel" aria-labelledby="trends-heading">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="trends-heading" class="panel-title" style="border:none; margin:0;">Your Trends</h2>
        <select id="dashboardRange" class="input select" style="width:auto; font-size:0.85rem; padding:6px 10px;">
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
        </select>
      </div>

      <div class="charts-wrapper">
        <div class="chart-box">
           <canvas id="intensityLineChart"></canvas>
        </div>
        <div class="chart-box">
           <canvas id="routineBarChart"></canvas>
        </div>
      </div>
    </section>

    <div class="widgets-grid">
      
      <section class="panel panel-soft" aria-labelledby="suggestions-heading">
        <h2 id="suggestions-heading" class="panel-title">Suggestions</h2>
        <div id="suggestions" class="suggestions-list">
          <p class="small-italic">Check in above to see suggestions.</p>
        </div>
      </section>

      <section class="panel panel-soft" aria-labelledby="breathing-heading">
        <h2 id="breathing-heading" class="panel-title">Breathing</h2>
        <div class="breathing-container">
          <p id="breathingPhase" class="small-italic" style="margin-bottom:12px;">Ready</p>
          <div class="breathing-circle" id="breathingCircle">
            <span id="breathingCount">Start</span>
          </div>
          <button id="startBreathing" class="btn-ghost">Start Animation</button>
          <button id="startGrounding" class="btn-ghost" style="margin-top:8px">Grounding 5-4-3-2-1</button>
          <div id="groundingBox" class="small-italic" style="margin-top:8px"></div>
        </div>
      </section>

      <section class="panel panel-soft" aria-labelledby="pathways-heading">
        <h2 id="pathways-heading" class="panel-title">Pathways</h2>
        <select id="pathwaySelect" class="input select">
          <option value="">Choose a guide...</option>
        </select>
        <button id="startPathwayBtn" class="btn-primary" style="margin-top:12px; width:100%;">Begin</button>
        <div id="pathwayPlayer" class="muted small-italic" style="margin-top:12px; min-height:60px;"></div>
      </section>

      <section class="panel panel-soft" aria-labelledby="resources-heading">
        <h2 id="resources-heading" class="panel-title">Library</h2>
        <input id="resourceSearch" type="text" class="input" placeholder="Search topics..." oninput="searchResourcesUI()">
        <div id="resourceResults" style="margin-top:12px; max-height:200px; overflow-y:auto;"></div>
      </section>

      <section class="panel" aria-labelledby="privacy-heading">
        <h2 id="privacy-heading" class="panel-title">Privacy</h2>
        <p class="small-italic">Manage your local data.</p>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button id="exportDataBtn" class="btn-ghost" style="text-align:left;">Download Data (JSON)</button>
          <div id="exportStatus" class="small-italic"></div>
          
          <button id="deleteAllDataBtn" class="btn-danger" style="text-align:left;">Delete Everything</button>
          <div id="deleteStatus" class="small-italic"></div>
        </div>
      </section>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/search.js"></script>
  <script src="js/interventions.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/dayContext.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/app.js"></script>
  <script src="js/export.js"></script>

</body>
</html>
